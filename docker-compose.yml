services:
  app:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      - HTTP_PORT=8080
      - DATA_DIR=/app/data
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WA_LOG_LEVEL=${WA_LOG_LEVEL:-INFO}
      - DB_DIALECT=postgres
      - DB_ADDRESS=postgres://whatsmeow:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/whatsmeow?sslmode=disable
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RABBITMQ_URL=amqp://whatsmeow:${RABBITMQ_PASSWORD:-securepassword}@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-whatsmeowAdmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-securepassword}
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=${MINIO_BUCKET:-whatsmeow-media}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-600}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_MAX_ATTEMPTS=${WEBHOOK_MAX_ATTEMPTS:-8}
      - MEDIA_ARCHIVE_ENABLED=${MEDIA_ARCHIVE_ENABLED:-true}
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-0}
      - SEND_PACING_ENABLED=${SEND_PACING_ENABLED:-true}
      - SIMULATE_TYPING=${SIMULATE_TYPING:-false}
    expose:
      - "8080"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/health" ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - whatsmeow-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    ports:
      # Apenas amarrado a localhost para acesso direto opcional.
      # No Easypanel, aponte o domínio para a porta 80 do serviço frontend.
      - "127.0.0.1:${PORT_FRONTEND:-3179}:80"
    depends_on:
      - app
    networks:
      - whatsmeow-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsmeow-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=whatsmeow
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-securepassword}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - whatsmeow-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-whatsmeowAdmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-securepassword}
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - whatsmeow-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=whatsmeow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRES_DB=whatsmeow
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U whatsmeow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsmeow-net

networks:
  whatsmeow-net:
    driver: bridge

volumes:
  app_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
