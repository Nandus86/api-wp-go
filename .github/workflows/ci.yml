name: CI

on:
  push:
    branches: [main, "0.0.*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wm
          POSTGRES_PASSWORD: wm
          POSTGRES_DB: wm_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate Swagger docs (imported by the API package)
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go --output docs
      - name: Vet
        run: go vet ./cmd/... ./internal/... ./pkg/config ./pkg/logger
      - name: Test (unit + integration)
        env:
          TEST_DATABASE_URL: postgres://wm:wm@localhost:5432/wm_it?sslmode=disable
        # -p 1: integration tests share one database and reset its schema.
        run: go test -p 1 -count=1 ./cmd/... ./internal/... ./pkg/config ./pkg/logger
      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t whatsmeow-basileia-app:ci ./backend
      - name: Build frontend image
        run: docker build -t whatsmeow-basileia-frontend:ci ./frontend
